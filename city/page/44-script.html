<script>
  // ---------- Walls and gates ----------
  // An ADR that governs a place stands there: a low wall along the side of
  // the block it guards, with an amber gate in it. The gate's sign opens its
  // card. A wall turns red when a road goes over it (city-borders-lib).
  const GATES = G.gates || [];
  const blockById = new Map(blocks.map((b) => [b.id, b]));
  // Across main street from downtown, the town hall (45-script).
  const HALL_AT = { x: rowA[0].x0 + 8, z: city.z1 + 10 };
  city.z1 = HALL_AT.z + 9;
  const WALL_C = new THREE.Color("#5b7085");
  const edgeOf = (a, b) => out[a].find((k) => E[k].t === b);

  // The line a gate's wall runs along, as [x0, z0, x1, z1].
  function wallLine(at, side) {
    const r = at === "city" ? city : blockById.get(at);
    if (!r) return null;
    const o = at === "city" ? 0 : 2;
    const [x0, x1, z0, z1] = [r.x0 - o, r.x1 + o, r.z0 - o, r.z1 + o];
    return {
      front: [x0, z1, x1, z1],
      back: [x0, z0, x1, z0],
      west: [x0, z0, x0, z1],
      east: [x1, z0, x1, z1],
    }[side];
  }
  function wallMesh([x0, z0, x1, z1], bad, thin) {
    const len = Math.hypot(x1 - x0, z1 - z0);
    const geo = new THREE.BoxGeometry(len, thin ? 0.9 : 1.5, 0.45);
    geo.translate(0, thin ? 0.45 : 0.75, 0);
    const c = bad ? RED : WALL_C;
    const m = new THREE.Mesh(
      geo,
      new THREE.MeshStandardMaterial({
        color: c,
        emissive: c,
        emissiveIntensity: bad ? 0.45 : 0.08,
        roughness: 0.8,
      }),
    );
    m.position.set((x0 + x1) / 2, 0.3, (z0 + z1) / 2);
    m.rotation.y = -Math.atan2(z1 - z0, x1 - x0);
    scene.add(m);
  }
  function gateMesh(x, z, angle, bad) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
      color: bad ? RED : AMBER,
      emissive: bad ? RED : AMBER,
      emissiveIntensity: 0.55,
    });
    for (const s of [-1.5, 1.5]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.4, 0.8), mat);
      post.position.set(s, 1.7, 0);
      g.add(post);
    }
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.5, 0.9), mat);
    lintel.position.set(0, 3.5, 0);
    g.add(lintel);
    g.position.set(x, 0.3, z);
    g.rotation.y = angle;
    scene.add(g);
  }

  // Signs over the gates and the town hall: buttons that follow the map.
  const marks = [];
  function mark(text, cls, at, go, title) {
    const b = el("button", {
      type: "button",
      className: "mark " + cls,
      textContent: text,
      title,
    });
    b.onclick = () => {
      touched();
      go();
    };
    $("marks").append(b);
    marks.push({ b, at, w: 0, h: 0 });
    return b;
  }
  function placeMarks(put, proj) {
    const dim = focusActive() || state.sel >= 0;
    for (const m of marks) {
      const p = proj(m.at.x, m.at.y, m.at.z);
      if (!p) {
        m.b.hidden = true;
        continue;
      }
      if (!m.w && !m.b.hidden) [m.w, m.h] = [m.b.offsetWidth, m.b.offsetHeight];
      const w = m.w || 64,
        h = m.h || 22,
        x = p[0] - w / 2;
      // Signs that would overlap stack upwards, like a signpost.
      let y = p[1] - h - 4;
      for (let t = 0; t < 4 && !put(x, y, w, h); t++) y -= h + 3;
      m.b.hidden = false;
      m.b.classList.toggle("dim", dim && state.alarm?.gate?.id !== m.id);
      m.b.style.transform = `translate(${x}px, ${y}px)`;
    }
  }

  // Build them: one wall per place and side, its gates spread along it.
  const bySide = new Map();
  for (const g of GATES) {
    const key = g.at + "|" + g.side;
    bySide.set(key, [...(bySide.get(key) ?? []), g]);
  }
  for (const list of bySide.values()) {
    const { at, side } = list[0];
    const bad = list.some((g) => g.over.length);
    let lines;
    if (at === "downtown") {
      // Features don't trade: a thin wall between each two, one gate midway.
      lines = rowA.slice(1).map((b, k) => {
        const a = rowA[k],
          x = (a.x1 + b.x0) / 2;
        return [x, Math.min(a.z0, b.z0) - 1, x, Math.max(a.z1, b.z1) + 1];
      });
      lines.forEach((l) => wallMesh(l, bad, true));
      lines = [lines[Math.floor(lines.length / 2)]];
    } else {
      const l = wallLine(at, side);
      if (!l) continue;
      wallMesh(l, bad, false);
      lines = [l];
    }
    const [x0, z0, x1, z1] = lines[0];
    list.forEach((g, k) => {
      const t = (k + 1) / (list.length + 1);
      const x = x0 + (x1 - x0) * t,
        z = z0 + (z1 - z0) * t;
      gateMesh(x, z, -Math.atan2(z1 - z0, x1 - x0), g.over.length > 0);
      const b = mark(
        `ADR ${g.adr}`,
        "gate" + (g.over.length ? " bad" : ""),
        { x, y: 4.6, z },
        () => showGate(g),
        g.title,
      );
      marks[marks.length - 1].id = g.id;
      g.pos = { x, z };
      b.setAttribute("aria-label", `Gate: ${g.title}, ADR ${g.adr}`);
    });
  }

  // A gate's card lights the roads through it, and any over the wall in red.
  function showGate(g) {
    clearFocus();
    state.pathFrom = -1;
    state.sel = -1;
    state.alarm = { gate: g, title: g.title };
    const light = (ids, red) => {
      const [a, b] = idsOf(ids);
      for (const i of [a, b])
        if (i != null) {
          showDistrict(blockOf[i].district);
          lit[i] = 1;
        }
      const k = a != null && b != null ? edgeOf(a, b) : null;
      if (k != null) litEdge[k] = red ? 2 : 1;
    };
    g.through.forEach((p) => light(p, false));
    g.over.forEach((it) => light(it.ids || [], true));
    if (nodes.some((n, i) => lit[i] && n.added > state.time))
      setTime(lastCommit);
    // A gate no road needs to cross lights nothing, so the city stays lit.
    state.alarm.quiet = !lit.some(Boolean);
    paint();
    renderInspector();
    if (!state.alarm.quiet) fit();
    else
      frameBox(
        new THREE.Box3(
          new THREE.Vector3(g.pos.x - 22, 0, g.pos.z - 22),
          new THREE.Vector3(g.pos.x + 22, 8, g.pos.z + 22),
        ),
        VIEW,
      );
  }
</script>
