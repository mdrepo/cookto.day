<script>
  // ---------- The people (#247) ----------
  // Painted wooden figures, one set: glossy paint, painted eyes and cheeks.
  // Their clothes say who they are (48-script places them); the light at
  // their feet says how things stand.
  const LIGHT = {
    ok: "#7cc47a",
    warn: "#ffb547",
    bad: "#ff6b57",
    calm: "#7fb2e5",
  };
  const coats = new Map();
  function lacquer(c, rough = 0.32) {
    const k = c + rough;
    if (!coats.has(k))
      coats.set(
        k,
        new THREE.MeshPhysicalMaterial({
          color: c,
          roughness: rough,
          clearcoat: rough < 0.6 ? 0.9 : 0,
          clearcoatRoughness: 0.18,
          emissive: c,
          emissiveIntensity: 0.14,
        }),
      );
    return coats.get(k);
  }
  const metal = (c, glow) =>
    new THREE.MeshStandardMaterial({
      color: c,
      metalness: 0.85,
      roughness: 0.3,
      emissive: glow,
      emissiveIntensity: 0.4,
    });
  const GOLD = metal("#e0b04a", "#6b4d12"),
    STEEL = metal("#cfd6dc", "#39424a");
  function part(g, geo, m, x, y, z, s) {
    const o = new THREE.Mesh(geo, typeof m === "string" ? lacquer(m) : m);
    o.position.set(x, y, z);
    if (s) o.scale.set(...s);
    g.add(o);
    return o;
  }
  const V2 = (pts) => pts.map(([r, y]) => new THREE.Vector2(r, y));
  // Coats turned on a lathe, like the body of a wooden toy.
  const coatOf = (hem) =>
    new THREE.LatheGeometry(
      V2([
        [0, hem],
        [hem < 0.9 ? 0.46 : 0.4, hem],
        [0.38, hem + 0.16],
        [0.32, 1.34],
        [0.35, 1.62],
        [0.33, 1.84],
        [0.2, 1.98],
        [0, 2],
      ]),
      28,
    );
  const TUNIC = coatOf(0.92),
    LONGCOAT = coatOf(0.5);
  const SKIN = ["#e3b48f", "#a8714b", "#c98f63", "#7b4f33", "#f0c6a4"];
  const ball = (r) => new THREE.SphereGeometry(r, 14, 10);

  // One figure: boots, legs, coat, arms, a head with painted eyes and
  // cheeks. `d` picks the colours; hats and tools go on after.
  function figure(d, k) {
    const g = new THREE.Group(),
      skin = SKIN[k % SKIN.length];
    const boot = new THREE.CapsuleGeometry(0.12, 0.16, 4, 10),
      arm = new THREE.CapsuleGeometry(0.085, 0.48, 4, 10);
    for (const s of [-1, 1]) {
      part(g, boot, "#141414", s * 0.15, 0.17, 0.04, [1, 1, 1.3]);
      part(
        g,
        new THREE.CylinderGeometry(0.135, 0.125, 0.62, 14),
        d.legs,
        s * 0.15,
        0.62,
        0,
      );
      if (d.stripe)
        part(
          g,
          new THREE.BoxGeometry(0.03, 0.6, 0.03),
          d.stripe,
          s * 0.27,
          0.62,
          0,
        );
      part(g, arm, d.sleeve ?? d.coat, s * 0.43, 1.56, 0).rotation.z = s * 0.1;
      part(g, ball(0.09), d.gloves ?? skin, s * 0.46, 1.22, 0);
      if (d.epaulettes)
        part(g, ball(0.11), GOLD, s * 0.36, 1.92, 0, [1.3, 0.45, 1]);
      if (d.crossbelts)
        part(
          g,
          new THREE.BoxGeometry(0.07, 0.8, 0.03),
          d.crossbelts,
          0,
          1.62,
          0.34,
        ).rotation.z = s * 0.62;
      part(
        g,
        new THREE.SphereGeometry(0.032, 8, 6),
        "#121212",
        s * 0.09,
        2.3,
        0.245,
      );
      part(g, ball(0.05), "#e8837a", s * 0.15, 2.2, 0.215, [1, 0.6, 0.4]);
    }
    part(g, d.long ? LONGCOAT : TUNIC, d.coat, 0, 0, 0);
    part(
      g,
      new THREE.CylinderGeometry(0.335, 0.335, 0.08, 28),
      d.belt ?? "#141414",
      0,
      1.34,
      0,
    );
    if (d.buttons)
      for (const y of [1.48, 1.62, 1.76])
        part(g, ball(0.035), GOLD, 0, y, 0.35);
    part(g, new THREE.CylinderGeometry(0.1, 0.11, 0.12, 12), skin, 0, 2.02, 0);
    part(g, new THREE.SphereGeometry(0.27, 24, 18), skin, 0, 2.27, 0);
    return g;
  }

  // A soldier's tall hat, with the check's name on a gold plate.
  function hatPlate(text) {
    const c = document.createElement("canvas");
    c.width = 256;
    c.height = 64;
    const x = c.getContext("2d");
    x.fillStyle = "#e0b04a";
    x.fillRect(0, 0, 256, 64);
    x.fillStyle = "#141414";
    x.font = "700 34px 'JetBrains Mono', monospace";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillText(text, 128, 34, 240);
    return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) });
  }
  function shako(g, label, plume) {
    part(
      g,
      new THREE.CylinderGeometry(0.25, 0.27, 0.46, 24),
      "#121212",
      0,
      2.62,
      0,
    );
    part(
      g,
      new THREE.CylinderGeometry(0.275, 0.275, 0.05, 24),
      GOLD,
      0,
      2.41,
      0,
    );
    part(g, new THREE.BoxGeometry(0.32, 0.03, 0.16), "#121212", 0, 2.41, 0.3);
    part(g, ball(0.07), plume, 0, 2.94, 0.04, [1, 1.9, 1]);
    part(
      g,
      new THREE.PlaneGeometry(0.5, 0.125),
      hatPlate(label),
      0,
      2.66,
      0.268,
    );
  }
  function rifle(g, x) {
    part(
      g,
      new THREE.CylinderGeometry(0.045, 0.06, 1.25, 8),
      "#7a4e2a",
      x,
      1.5,
      0.12,
    );
    part(
      g,
      new THREE.CylinderGeometry(0.022, 0.022, 0.45, 8),
      STEEL,
      x,
      2.33,
      0.12,
    );
    part(g, new THREE.ConeGeometry(0.03, 0.28, 8), STEEL, x, 2.69, 0.12);
  }

  // A gate's soldier wears the colour of the place it guards.
  function soldier(k, coat, label) {
    const g = figure(
      {
        coat,
        legs: "#1d2b4a",
        stripe: "#f2efe6",
        belt: "#f2efe6",
        crossbelts: "#f2efe6",
        gloves: "#f4f1e8",
        buttons: true,
        epaulettes: true,
      },
      k,
    );
    shako(g, label, "#f4f1e8");
    rifle(g, 0.56);
    return g;
  }
  // The guard of honour: white coats, gold belts, red plumes.
  function honourGuard(k, label) {
    const g = figure(
      {
        coat: "#f2efe6",
        legs: "#1d2b4a",
        stripe: "#c8242c",
        belt: "#e0b04a",
        crossbelts: "#e0b04a",
        gloves: "#f4f1e8",
        buttons: true,
        epaulettes: true,
      },
      k,
    );
    shako(g, label, "#c8242c");
    rifle(g, 0.56);
    return g;
  }
</script>
