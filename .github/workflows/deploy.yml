name: Deploy

# Every merge to main goes live on https://cookto.day (ADR 0014), but only
# after the same gates a PR passes, plus the e2e tests, on the merged code.
# A failing gate means nothing is deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the older one to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

# No permissions by default; the job grants only what it needs.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cookto.day

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # uses "packageManager"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      # The browser tests gate the deploy (ADR 0014), offline as always (ADR 0004).
      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run e2e

      - name: Build
        run: bun run build

      # wrangler is pinned to a release at least 7 days old (ADR 0005) and runs
      # only here, so it is not a project dependency.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.147.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
