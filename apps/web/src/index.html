<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>cookto.day</title>
    <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./brand/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.tsx"></script>
  </head>
  <body>
    <!-- The English page, readable before the script runs. React takes it over
         (main.tsx); keep this markup the same as app.tsx. -->
    <div id="app">
      <header class="site-header">
        <h1 class="site-title">cookto.day</h1>
        <p class="site-tagline">
          What to cook today, from what's already in your kitchen
        </p>
        <label class="field">
          <span>Language</span>
          <select id="language" class="field-select"></select>
        </label>
      </header>
      <main class="page">
        <section class="empty-state" aria-labelledby="empty-title">
          <h2 id="empty-title" class="empty-title">Your kitchen is empty</h2>
          <p class="empty-body">
            Add a grocery bill to see what you can cook today
          </p>
        </section>
        <p class="note">
          Your bills and pantry stay in this browser. Nothing is uploaded.
        </p>
      </main>
    </div>
  </body>
</html>
