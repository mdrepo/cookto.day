name: Deploy

# Every merge to main goes live on https://cookto.day (ADR 0014), but only
# after the same gates a PR passes, plus the e2e tests, on the merged code.
# A failing gate means nothing is deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the older one to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

# No permissions by default; the job grants only what it needs.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cookto.day

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # uses "packageManager"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Everything, not only what changed (ADR 0016): this is the safety net.
      - name: Check
        run: bun run check

      # The browser tests gate the deploy (ADR 0014), offline as always (ADR 0004).
      - name: Install the test browser
        run: bunx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: bun run e2e

      - name: Build
        run: bun run build

      # The kit page (ADR 0019) goes live beside the app, at cookto.day/kit/.
      - name: Put the kit at /kit/
        run: cp -R apps/kit/dist apps/web/dist/kit

      # Wrangler is pinned to a release at least 7 days old (ADR 0005) and runs
      # only here, so it is not a project dependency. bunx runs it from its own
      # cache: npm (which cloudflare/wrangler-action uses) can't install into a
      # Bun workspace (ADR 0016).
      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.147.0 deploy
