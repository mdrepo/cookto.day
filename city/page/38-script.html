<script>
  function refresh() {
    refreshRise();
    if (state.sel >= 0 && !visible(state.sel)) select(-1, false);
    else if (state.sel >= 0 && state.cone) select(state.sel, false);
    else paint();
  }
  addEventListener("keydown", (e) => {
    if (e.target.matches("input, select")) return;
    if (e.key === "/") {
      e.preventDefault();
      q.focus();
    } else if (e.key === "f" || e.key === "F") fit();
    else if (e.key === "Escape") {
      state.pathFrom = -1;
      select(-1, false);
    } else if (e.key === "ArrowLeft" || e.key === "a") panBy(-1, 0);
    else if (e.key === "ArrowRight" || e.key === "d") panBy(1, 0);
    else if (e.key === "ArrowUp" || e.key === "w") panBy(0, 1);
    else if (e.key === "ArrowDown" || e.key === "s") panBy(0, -1);
  });
  $("stats").textContent =
    `${N} buildings · ${E.length.toLocaleString()} roads · ${G.commits.length} commits · at ${G.head.h}, ${G.scanned}`;
  // The city starts in 49-script, once every part is loaded.
</script>
