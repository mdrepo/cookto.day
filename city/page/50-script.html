<script>
  // ---------- Run ----------
  // Every part is loaded: fill the panels, then start the city from far away.
  // The drawing and its labels both take the canvas's own size: on a phone
  // the window's size changes as the browser's bars come and go (#252).
  function resize() {
    const w = canvas.clientWidth || innerWidth,
      h = canvas.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    measure();
  }
  addEventListener("resize", resize);
  visualViewport?.addEventListener("resize", resize);
  // Safari zooms the whole page on a pinch over the panels: only the city
  // zooms (#252).
  for (const kind of ["gesturestart", "gesturechange"])
    document.addEventListener(kind, (e) => e.preventDefault());
  renderTopics();
  renderNotices();
  renderHall();
  tintMasses();
  resize();
  renderDistricts();
  renderCheck();
  renderInspector();
  setTime(lastCommit);
  fit();
  if (flight) {
    camera.position.copy(flight.toP);
    controls.target.copy(flight.toT);
    flight = null;
  }
  updateZoom(1);
  for (let i = 0; i < N; i++) rise[i] = riseTo[i];
  update(0);
  setTimeout(touched, 8000);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (flight) {
      flight.t = Math.min(1, flight.t + dt / (reduced ? 0.2 : 1));
      const k = flight.t * flight.t * (3 - 2 * flight.t);
      controls.target.lerpVectors(flight.fromT, flight.toT, k);
      camera.position.lerpVectors(flight.fromP, flight.toP, k);
      if (flight.t >= 1) flight = null;
    }
    applyOffset(dt);
    hover();
    updateZoom(dt);
    update(dt);
    updateFacade();
    controls.update();
    renderer.render(scene, camera);
    drawLabels();
    updateWhere();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
