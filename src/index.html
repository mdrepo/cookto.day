<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>cookto.day</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">cookto.day</h1>
      <p class="site-tagline" data-i18n="tagline">
        What to cook today, from what's already in your kitchen
      </p>
      <label class="field">
        <span data-i18n="languageLabel">Language</span>
        <select id="language" class="field-select"></select>
      </label>
    </header>
    <main class="page">
      <section class="empty-state" aria-labelledby="empty-title">
        <h2 id="empty-title" class="empty-title" data-i18n="emptyTitle">
          Your kitchen is empty
        </h2>
        <p class="empty-body" data-i18n="emptyBody">
          Add a grocery bill to see what you can cook today
        </p>
      </section>
      <p class="note" data-i18n="privacy">
        Your bills and pantry stay in this browser. Nothing is uploaded.
      </p>
    </main>
  </body>
</html>
