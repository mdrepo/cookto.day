name: Task
description: Something people should be able to do (a change in behaviour).
type: Task
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        This issue becomes the spec (`specs/<issue>-<short-name>.md`). Describe what people do and see, not how to code it. See docs/workflow.md.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does the household have?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: One per behaviour, as Given / When / Then in the user's words. Each becomes an e2e test.
      value: |
        1. Given ...
           When ...
           Then ...
    validations:
      required: true
  - type: textarea
    id: languages
    attributes:
      label: Words and languages
      description: New text people will see, in English. Translations into Hindi, Marathi and Arabic are part of the change (ADR 0012).
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: questions
    attributes:
      label: Open questions for an owner
