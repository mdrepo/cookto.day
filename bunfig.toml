[install]
# Save exact versions on `bun add` (ADR 0005).
exact = true
# Refuse versions published in the last 7 days (in seconds), to avoid freshly
# hijacked releases (ADR 0005).
minimumReleaseAge = 604800


# No [test] section: each workspace runs its own tests from its test/ folder
# (`bun test ./test`), through `bun run test` at the root (ADR 0016). A bare
# `bun test` here would also pick up the Playwright specs in apps/web/e2e/.
