name: City

# The repo as a night city (bun run city, #211), published for everyone at
# https://mdrepo.github.io/cookto.day/ after every merge to main. It is a
# picture of the code, not part of the app: cookto.day itself is deployed by
# deploy.yml and never serves this page. The owner turns Pages on once, in the
# repo settings: Pages, Source, GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer merge replaces an older one still waiting.
concurrency:
  group: city
  cancel-in-progress: true

# No permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code, with its whole history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The city reads git log: when each building came and last changed.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # uses "packageManager"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Draw the city
        run: bun run city

      - name: Hand the page to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/city

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
