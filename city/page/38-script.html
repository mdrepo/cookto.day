<script>
  function refresh() {
    refreshRise();
    if (state.sel >= 0 && !visible(state.sel)) select(-1, false);
    else if (state.sel >= 0 && state.cone) select(state.sel, false);
    else paint();
  }
  function stop() {
    clearInterval(state.playing);
    state.playing = null;
    $("play").textContent = "▶";
  }
  function play(force) {
    if (state.playing && !force) return stop();
    stop();
    state.pathFrom = -1;
    select(-1, false);
    setTime(0);
    fit();
    $("play").textContent = "❚❚";
    state.playing = setInterval(
      () => {
        if (state.time >= lastCommit) return stop();
        setTime(state.time + 1);
      },
      reduced ? 40 : 120,
    );
  }
  time.oninput = () => {
    stop();
    setTime(+time.value);
  };
  $("play").onclick = () => play(false);

  addEventListener("keydown", (e) => {
    if (e.target.matches("input, select")) return;
    if (e.key === "/") {
      e.preventDefault();
      q.focus();
    } else if (e.key === "f" || e.key === "F") fit();
    else if (e.key === "Escape") {
      state.pathFrom = -1;
      select(-1, false);
    } else if (e.key === "ArrowLeft" || e.key === "a") panBy(-1, 0);
    else if (e.key === "ArrowRight" || e.key === "d") panBy(1, 0);
    else if (e.key === "ArrowUp" || e.key === "w") panBy(0, 1);
    else if (e.key === "ArrowDown" || e.key === "s") panBy(0, -1);
  });
  $("stats").textContent =
    `${N} buildings · ${E.length.toLocaleString()} roads · ${G.commits.length} commits · at ${G.head.h}, ${G.scanned}`;

  // ---------- Run ----------
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    measure();
  }
  addEventListener("resize", resize);
  resize();
  renderDistricts();
  renderCheck();
  renderInspector();
  setTime(lastCommit);
  for (let i = 0; i < N; i++) rise[i] = riseTo[i];
  update(0);
  fit();
  if (flight) {
    camera.position.copy(flight.toP);
    controls.target.copy(flight.toT);
    flight = null;
  }
  setTimeout(touched, 8000);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (flight) {
      flight.t = Math.min(1, flight.t + dt / (reduced ? 0.2 : 1));
      const k = flight.t * flight.t * (3 - 2 * flight.t);
      controls.target.lerpVectors(flight.fromT, flight.toT, k);
      camera.position.lerpVectors(flight.fromP, flight.toP, k);
      if (flight.t >= 1) flight = null;
    }
    applyOffset(dt);
    hover();
    update(dt);
    updateFacade();
    controls.update();
    renderer.render(scene, camera);
    drawLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
