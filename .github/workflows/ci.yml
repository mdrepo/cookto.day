name: CI

# The gate every PR must pass. `bun run check` is the same command you run
# locally, so a green local check means a green CI check.
# E2E tests run locally, not here (ADR 0004).
# Nothing here deploys: merging never deploys (ADR 0009).

on:
  pull_request:
  push:
    branches: [main]

# No permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # uses "packageManager"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      # Known-vulnerable dependencies (ADR 0005).
      - name: Audit dependencies
        run: bun audit --audit-level=high

      # Secrets in any commit, not just the latest (ADR 0005). A pinned
      # release, checked against its published checksum.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner .
