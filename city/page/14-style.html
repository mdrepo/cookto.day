<style>
  /* The notice board: gaps, copies and what to do first, in the district panel's place. */
  #notices-btn em {
    font: 600 10.5px var(--mono);
    font-style: normal;
    color: var(--night);
    background: var(--amber);
    border-radius: 999px;
    padding: 1px 6px;
    margin-inline-start: 4px;
  }
  .btn[aria-pressed="true"] {
    border-color: var(--amber);
  }
  .legend[hidden] {
    display: none !important;
  }
  .notices {
    gap: 14px;
  }
  .why {
    margin: 0;
    padding: 0 6px;
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--muted);
  }
  .why.ok {
    color: var(--ok);
  }
  .wn {
    margin: 4px 0 8px;
    padding: 0 0 0 22px;
    display: grid;
    gap: 4px;
    font-size: 12px;
  }
  .wn li::marker {
    color: var(--amber);
    font: 700 12px var(--mono);
  }
  .wn button {
    display: grid;
    gap: 1px;
    width: 100%;
    text-align: start;
    background: none;
    border: 0;
    color: var(--ink);
    padding: 4px 6px;
    border-radius: 7px;
    cursor: pointer;
    font: 500 12px var(--body);
  }
  .wn button:hover {
    background: rgba(255, 255, 255, 0.07);
  }
  .wn b {
    font-weight: 700;
  }
  .wn span {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
  }
  .notices .btn {
    justify-self: start;
    margin: 0 6px;
  }
  .ng {
    border-top: 1px solid var(--rule);
    padding: 6px 0;
    display: grid;
    gap: 6px;
  }
  .ng summary {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 7px;
    font: 600 12.5px var(--display);
    list-style: none;
  }
  .ng summary::-webkit-details-marker {
    display: none;
  }
  .ng summary:hover {
    background: rgba(255, 255, 255, 0.07);
  }
  .ng summary em {
    font: normal 11px var(--mono);
    color: var(--muted);
  }
  .k {
    font: 600 9.5px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1px 4px;
    color: var(--muted);
  }
  .gap > summary .k,
  .ni.gap .k {
    color: var(--alarm);
    border-color: rgba(255, 107, 87, 0.5);
  }
  .copy > summary .k,
  .ni.copy .k {
    color: var(--amber);
    border-color: rgba(255, 181, 71, 0.5);
  }
  .nis {
    display: grid;
    gap: 2px;
  }
  .ni {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px;
    align-items: center;
  }
  .ni button {
    text-align: start;
    background: none;
    border: 0;
    color: var(--ink);
    padding: 4px 6px;
    border-radius: 7px;
    cursor: pointer;
    font: 400 12px/1.35 var(--body);
    overflow-wrap: anywhere;
  }
  .ni button:hover {
    background: rgba(255, 255, 255, 0.07);
  }
  .ni button .k {
    margin-inline-end: 6px;
  }
  .ni em {
    font: normal 10.5px var(--mono);
    color: var(--muted);
  }
  .ni a.link {
    padding: 2px 6px;
  }
  .law {
    display: grid;
    gap: 1px;
    padding: 5px 6px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
  }
  .law b {
    font-weight: 600;
  }
  .law small {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
  }
  .law.beat b::before {
    content: "●";
    color: var(--amber);
    margin-inline-end: 6px;
    font-size: 9px;
    vertical-align: 2px;
  }
  .plaque {
    margin: 0;
    font-size: 12px;
    color: var(--amber);
    border: 1px solid rgba(255, 181, 71, 0.4);
    border-radius: 8px;
    padding: 6px 9px;
    background: rgba(255, 181, 71, 0.06);
  }
  .chip em {
    font: normal 10px var(--mono);
    color: var(--muted);
  }
  a.chip {
    text-decoration: none;
  }
  @media (max-width: 820px) {
    .notices.open {
      display: flex;
      max-height: 55vh;
    }
  }
</style>
